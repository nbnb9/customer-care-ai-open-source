name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    env:
      APP_ENV: test
      ALLOW_DEMO_IDENTITY: "true"
      CI: "true"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3100
      CUSTOMER_TOOLS_PROVIDER: mock
      DATABASE_URL: postgresql+psycopg://customer_care_ci:synthetic-ci-only@127.0.0.1:5432/customer_care_e2e_test
      E2E_DATABASE_URL: postgresql+psycopg://customer_care_ci:synthetic-ci-only@127.0.0.1:5432/customer_care_e2e_test
      E2E_WEB_COMMAND: pnpm start --port 3100
      LLM_PROVIDER: fake
      LLM_MODEL: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
      NEXT_TELEMETRY_DISABLED: "1"
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_DB: customer_care_e2e_test
          POSTGRES_USER: customer_care_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U customer_care_ci -d customer_care_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install locked backend dependencies
        working-directory: apps/api
        run: uv sync --frozen --all-groups

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production frontend
        run: pnpm build

      - name: Run browser E2E
        run: pnpm test:e2e

      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
