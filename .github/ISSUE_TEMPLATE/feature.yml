name: Feature proposal
description: Propose a scoped product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Which verified user or operator problem does this address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe an observable outcome rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and operational boundaries
      description: Note tenant, identity, data, approval, idempotency, and external-provider effects.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What tests or real-user evidence should establish completion?
    validations:
      required: true
