[project]
name = "api"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.1.0",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
eval_triage = "app.evals.triage_cli:main"
eval-triage = "app.evals.triage_cli:main"
eval_rag = "app.evals.rag_cli:main"
eval-rag = "app.evals.rag_cli:main"
knowledge_worker = "app.modules.knowledge.worker:main"
after_sales_worker = "app.modules.after_sales.worker:main"
shopify_sandbox_smoke = "app.modules.customer_tools.shopify_smoke:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "offline: test does not require database or external services",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF001",  # 允许中文注释/文档中的全角标点
    "RUF002",
    "RUF003",
]
